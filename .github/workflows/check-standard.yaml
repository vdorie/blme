# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'ToDo'
  pull_request:
    branches: [master]
  # lme4 changes independently of blme, so check against its master weekly
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.lme4 && ', lme4 master' || '' }})

    # The last entry tests against lme4's master: blme copies and calls into
    # lme4 internals, so catch upstream changes before they reach CRAN.
    # Scheduled runs only use that entry, as nothing else changes between
    # pushes; a job-level `if` can't see the matrix, so the matrix itself
    # depends on the event.
    strategy:
      fail-fast: false
      matrix:
        config: >-
          ${{ fromJSON(github.event_name == 'schedule' && '[
          {"os": "ubuntu-latest",  "r": "release", "lme4": "github::lme4/lme4"}
          ]' || '[
          {"os": "macos-latest",   "r": "release"},
          {"os": "windows-latest", "r": "release"},
          {"os": "ubuntu-latest",  "r": "devel", "http-user-agent": "release"},
          {"os": "ubuntu-latest",  "r": "release"},
          {"os": "ubuntu-latest",  "r": "oldrel-1"},
          {"os": "ubuntu-latest",  "r": "release", "lme4": "github::lme4/lme4"}
          ]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # apt-get has been observed to stall indefinitely against the Ubuntu
      # archive mirror on hosted runners; bounded retries turn a stall into
      # a fast failure instead of one that burns the whole job timeout
      - name: Bound apt network stalls
        if: runner.os == 'Linux'
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 20
        with:
          extra-packages: any::rcmdcheck ${{ matrix.config.lme4 }}
          needs: check

      - name: Report lme4 version
        shell: Rscript {0}
        run: cat("lme4", as.character(packageVersion("lme4")), "\n")

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'
          args: 'c("--no-manual", "--as-cran")'
